name: Mwein verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    name: Website verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, mbstring, gd, fileinfo
          coverage: none
      - name: Verify generated assets are current
        run: |
          npm run website:build
          git diff --exit-code -- website/site
          test -z "$(git ls-files --others --exclude-standard website/site/assets)"
      - name: Check website source and interactions
        run: npm run website:test
      - name: Check PHP syntax
        run: find website -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify website backend with synthetic data
        run: python website/tests/backend_test.py
      - name: Check uploaded JPEG metadata handling
        run: php website/tests/jpeg_metadata_test.php
  platform:
    name: Platform verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Generate database client
        run: npm run db:generate
      - name: Check types
        run: npm run lint
      - name: Run platform tests
        run: npm test
      - name: Verify migrations and database constraints
        run: npm run test:migrations
      - name: Build without database credentials
        run: npm run vercel-build
      - name: Verify outpatient workflow against isolated test data
        run: npm run test:e2e
        env:
          E2E_PRODUCTION: "1"
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify browser workflows
        run: npm run test:browser
      - name: Build certification evidence index
        run: node scripts/certification-evidence.mjs --commit "$GITHUB_SHA" > certification/evidence-index.json
      - name: Retain certification evidence index
        uses: actions/upload-artifact@v4
        with:
          name: platform-certification-evidence
          path: platform/certification/evidence-index.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: platform-browser-failures
          path: platform/test-results/
          if-no-files-found: ignore
          retention-days: 7
  verify:
    name: Legacy compatibility verification
    defaults:
      run:
        working-directory: legacy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check scripts/backup.js
          node --check scripts/verify-backup.js
      - name: Run automated tests
        run: npm test
      - name: Build hardened container
        run: docker build --tag mwein-emr:verify .
      - name: Build verified cloud bundle
        run: npm run package-release
      - name: Upload cloud bundle
        uses: actions/upload-artifact@v4
        with:
          name: mwein-cloud-emr-source
          path: legacy/dist/mwein-cloud-emr-v*.zip
          if-no-files-found: error
          retention-days: 14
